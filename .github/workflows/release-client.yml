name: Release keevault client
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release-client-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/env-client/go.mod
          cache-dependency-path: apps/env-client/go.sum
      - name: Test client
        working-directory: apps/env-client
        run: |
          go vet ./...
          go test ./...
      - name: Validate release tag
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: node scripts/validate-release-version.mjs
      - name: Build static binaries
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: bash scripts/build-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: keevault-${{ github.ref_name }}
          path: |
            apps/env-client/dist/keevault-linux-*
            apps/env-client/dist/SHA256SUMS
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: releases
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: keevault-${{ github.ref_name }}
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check SHA256SUMS
          if gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            mkdir existing
            gh release download "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --dir existing
            for file in keevault-linux-amd64 keevault-linux-arm64 SHA256SUMS; do
              cmp "$file" "existing/$file"
            done
          else
            gh release create "$RELEASE_VERSION" keevault-linux-amd64 keevault-linux-arm64 SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          fi
      - name: Bootstrap release registration through keevault
        env:
          VAULT_BOOTSTRAP_TOKEN: ${{ secrets.VAULT_BOOTSTRAP_TOKEN }}
          VAULT_PENDING_TIMEOUT: 30m
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          : "${VAULT_BOOTSTRAP_TOKEN:?Configure the releases environment bootstrap token}"
          chmod +x dist/keevault-linux-amd64
          dist/keevault-linux-amd64 --config scripts/release.keevault.json
